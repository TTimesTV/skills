    source_time: "00:00:00.000-00:00:00.000"
    speech_anchor: ""
    editorial_goal: ""
    # Internal only; selection rationales are not repeated in the editor-facing Word.
    selection:
      viewer_gap: ""
      chosen_reason: ""
      rejected_alternative: "" # Include NONE when relevant; no mandatory alternatives essay.
      omission_cost: "" # If nothing is lost, consider NONE.
    continuity:
      concept_ids: []
      relation_to_prior: "" # FIRST | EXTEND | REUSE | RECAP | CLOSE | NA
      prior_segment_ids: []
      new_information: ""
    visual_need: "UNDECIDED" # REQUIRED | OPTIONAL | NONE after the decision gate
    composition_mode: "UNDECIDED"

    audio:
      speaker: ""
      spoken_text: ""

    speech_caption:
      mode: "UNDECIDED" # Decide from dominant reading object; never suppress by template default.
      zone: "LOWER"

    visual:
      placement_id: "M001-P01"
      asset_id: "M001"
      source_family: "COMPANY_OFFICIAL"
