      subject: ""
      action: ""
      setting: ""
      shot: ""
      camera: ""
      temporal_feel: ""
      tone: ""
      verbal_brief: ""
      include: []
      exclude: []
      duration: ""
      entry_anchor: ""
      exit_anchor: ""
      safe_area: ""
      source_candidates: []
      search_terms_ko: []
      search_terms_en: []
      status: "SEARCH_REQUESTED"
      source_status: "SOURCE_UNRESOLVED"
