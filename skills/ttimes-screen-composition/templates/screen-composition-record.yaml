schema_version: "0.2"
# Draft scaffold, not a completed decision. Resolve UNDECIDED before handoff.
# Remove unused visual objects and set editorial_captions: [] for no-caption beats.
project:
  title: ""
  authoritative_source: ""
  source_sha256: ""
  output_filename: ""

segments:
